[workspace]
resolver = "3"
members = [
    "examples/*", "origamic", "origamic-core", "origamic-noise", "origamic-tcp",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
description = "A self-organizing, decentralized P2P library in Rust for building recursive virtual networks."
authors = ["yuzu_mikan <unity75lets5@gmail.com>"]
repository = "https://github.com/kotagit75/origamic"
homepage = "https://github.com/kotagit75/origamic"
readme = "README.md"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["full", "io-util", "bytes"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.4"
serde = { version = "1.0", features = ["derive"] }
postcard = "1.2.0"
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3.34"
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
snow = "0.10.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
origamic-core = { path = "origamic-core", version = "0.1.0" }
origamic-tcp = { path = "origamic-tcp", version = "0.1.0" }
origamic-noise = { path = "origamic-noise", version = "0.1.0" }
origamic = { path = "origamic", version = "0.1.0" }
