[workspace]
resolver = "3"
members = [
    "examples/*", "origamic", "origamic-core", "origamic-noise", "origamic-tcp",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
description = "A self-organizing, decentralized P2P library in Rust for building recursive virtual networks."
authors = ["yuzu_mikan <unity75lets5@gmail.com>"]
repository = "https://github.com/kotagit75/origamic"
homepage = "https://github.com/kotagit75/origamic"
readme = "README.md"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1.12.2"
snow = "0.10.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
origamic-core = { path = "origamic-core" }
origamic-tcp = { path = "origamic-tcp" }
origamic-noise = { path = "origamic-noise" }
origamic = { path = "origamic" }
